<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Controllo permessi spazi confinati</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#ffffff; --side:#f9f9f9; --sub:#f4f4f4; --fg:#0d0d0d; --mut:#5c5c5c; --faint:#6b6b6b;
  --line:#e5e5e5; --line2:#efefef; --hover:#f0f0f0; --card:#ffffff;
  --pri:#0d0d0d; --pri-fg:#ffffff; --pri-h:#2b2b2b; --pri-dis:#d9d9d9;
  --ok:#0d7a5a; --okbg:#e8f6f0; --wa:#975a00; --wabg:#fdf3e0; --ko:#c2322a; --kobg:#fdecea;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 2px 8px -2px rgba(0,0,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#212121; --side:#181818; --sub:#2a2a2a; --fg:#ececec; --mut:#b4b4b4; --faint:#9a9a9a;
  --line:#363636; --line2:#2c2c2c; --hover:#2f2f2f; --card:#262626;
  --pri:#ececec; --pri-fg:#0d0d0d; --pri-h:#ffffff; --pri-dis:#454545;
  --ok:#5fd0a8; --okbg:#18352b; --wa:#f0b860; --wabg:#3a2d15; --ko:#ff8f84; --kobg:#45201c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#212121; --side:#181818; --sub:#2a2a2a; --fg:#ececec; --mut:#b4b4b4; --faint:#9a9a9a;
  --line:#363636; --line2:#2c2c2c; --hover:#2f2f2f; --card:#262626;
  --pri:#ececec; --pri-fg:#0d0d0d; --pri-h:#ffffff; --pri-dis:#454545;
  --ok:#5fd0a8; --okbg:#18352b; --wa:#f0b860; --wabg:#3a2d15; --ko:#ff8f84; --kobg:#45201c;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font:15px/1.5 "Instrument Sans","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default}
svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace;font-size:14px;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
::selection{background:color-mix(in srgb,var(--fg) 15%,transparent)}
input{caret-color:var(--fg)}
:focus{outline:none}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px;border-radius:8px}
*{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* pulsanti */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 18px;border-radius:999px;font-weight:600;font-size:14.5px;white-space:nowrap;transition:background .15s,border-color .15s}
.btn svg{width:17px;height:17px}
.btn.pri{background:var(--pri);color:var(--pri-fg)}
.btn.pri:hover:not(:disabled){background:var(--pri-h)}
.btn.pri:disabled{background:var(--pri-dis);color:var(--bg)}
.btn.sec{border:1px solid var(--line);background:var(--card)}
.btn.sec:hover:not(:disabled){background:var(--hover)}
.btn.sec:disabled{opacity:.45}
.btn.sm{height:32px;padding:0 12px;font-size:13.5px}
.btn.txt{height:32px;padding:0 10px;color:var(--mut);font-weight:500}
.btn.txt:hover{background:var(--hover);color:var(--fg)}
.icon-btn{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:var(--mut)}
.icon-btn:hover{background:var(--hover);color:var(--fg)}

/* layout */
.app{display:flex;height:100vh}
.side{width:264px;flex:none;background:var(--side);display:flex;flex-direction:column;padding:10px;border-right:1px solid var(--line2);transition:transform .25s cubic-bezier(.16,1,.3,1)}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{height:56px;display:flex;align-items:center;gap:8px;padding:0 16px;flex:none}
.top .name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menuBtn{display:none}
.scroll{flex:1;overflow-y:auto}
.wrap{max-width:880px;margin:0 auto;padding:12px 24px 48px}

/* barra laterale */
.brand{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;font-weight:600}
.brand .mk{width:28px;height:28px;border-radius:8px;background:var(--pri);color:var(--pri-fg);display:grid;place-items:center}
.brand .mk svg{width:15px;height:15px;stroke-width:2.4}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:10px;font-size:14.5px;font-weight:500;text-align:left}
.nav-btn:hover{background:var(--hover)}
.side-label{font-size:12px;font-weight:600;color:var(--faint);padding:16px 10px 6px}
.hist{flex:1;overflow-y:auto;margin:0 -4px;padding:0 4px}
.h-item{position:relative;display:block;width:100%;text-align:left;padding:8px 34px 8px 10px;border-radius:10px;font-size:14px}
.h-item:hover,.h-item.on{background:var(--hover)}
.h-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-s{font-size:12px;color:var(--faint);display:flex;gap:6px;align-items:center}
.dot{width:7px;height:7px;border-radius:50%;flex:none;display:inline-block}
.dot.ok{background:var(--ok)}.dot.wa{background:var(--wa)}.dot.ko{background:var(--ko)}
.h-del{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:26px;height:26px;border-radius:7px;display:none;place-items:center;color:var(--mut)}
.h-item:hover .h-del,.h-item.on .h-del{display:grid}
.h-del:hover{color:var(--ko);background:var(--bg)}
.h-del svg{width:15px;height:15px}
.h-empty{font-size:13px;color:var(--faint);padding:2px 10px}
.xbox{border-top:1px solid var(--line);padding:12px 4px 2px;margin-top:6px}
.xbox .lbl{font-size:12px;font-weight:600;color:var(--faint);padding:0 4px 8px}
.x-row{display:flex;gap:10px;align-items:center;padding:0 4px}
.x-ico{width:34px;height:34px;border-radius:9px;background:#1d7a46;color:#fff;display:grid;place-items:center;flex:none}
.x-ico svg{width:17px;height:17px}
.x-name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x-meta{font-size:12px;color:var(--faint);line-height:1.4}
.x-btns{display:flex;gap:6px;margin-top:10px}
.x-btns .btn{flex:1;height:34px;font-size:13px;padding:0 8px}
.side-foot{display:flex;justify-content:space-between;padding:8px 0 0}
.plan{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;margin:8px 0 2px;font-size:13px}
.plan .pt{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.plan .pt span{color:var(--mut);font-weight:500}
.plan .bar{margin:8px 0 10px}
.plan .btn{width:100%;height:34px;font-size:13px}
.plan.on .pt span{color:var(--ok)}
.plan.empty .bar i{background:var(--ko)}
/* aggiungi al registro */
.reg-l{display:grid;gap:8px;margin:0 0 14px}
.reg-i{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.reg-i input[type=checkbox]{width:18px;height:18px;margin:2px 0 0;accent-color:var(--fg);flex:none}
.reg-i.off{background:var(--side)}
.reg-i .t{font-weight:600;font-size:14px}
.reg-i .m{font-size:13px;color:var(--mut)}
.reg-i .why{font-size:13px;color:var(--wa);margin-top:2px}
.reg-i .capo{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.reg-i .capo input{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;background:var(--bg);font-size:13.5px}
.reg-i .capo input:focus{border-color:var(--fg)}
.pay .err{background:var(--kobg);color:var(--ko);border-radius:10px;padding:10px 12px;font-size:13.5px;margin:0 0 12px;display:none}
/* paywall */
#pay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:35;padding:16px}
#pay.on{display:flex}
.pay{background:var(--bg);color:var(--fg);border-radius:20px;width:100%;max-width:520px;max-height:100%;overflow:auto;padding:24px;box-shadow:0 20px 60px -10px rgba(0,0,0,.35);position:relative}
.pay h2{font-size:21px;font-weight:600;letter-spacing:-.01em;margin:0 0 6px;padding-right:36px}
.pay>p{color:var(--mut);margin:0 0 18px;font-size:14.5px}
.pay .close{position:absolute;top:16px;right:16px}
.plans{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pl{display:block;position:relative;border:1.5px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:border-color .15s,background .15s}
.pl:hover{background:var(--hover)}
.pl input{position:absolute;opacity:0;pointer-events:none}
.pl:has(input:checked){border-color:var(--fg)}
.pl:has(input:focus-visible){outline:2px solid var(--fg);outline-offset:2px}
.pl .n{font-weight:600;font-size:14px}
.pl .pr{font-size:24px;font-weight:600;margin:4px 0 0;letter-spacing:-.01em}
.pl .pr small{font-size:13px;color:var(--mut);font-weight:500}
.pl .d{font-size:12.5px;color:var(--mut)}
.inc{list-style:none;padding:0;margin:16px 0 18px;font-size:14px;display:grid;gap:6px}
.inc li{display:flex;gap:8px;align-items:center}
.inc svg{width:16px;height:16px;color:var(--ok)}
.pay .btn.pri{width:100%;height:44px}
.pay .note{font-size:12.5px;color:var(--faint);text-align:center;margin:10px 0 0}
@media (max-width:520px){.plans{grid-template-columns:1fr}.pay{padding:20px 18px}}

/* caricamento */
.page-h{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:28px 0 4px}
.page-s{color:var(--mut);margin:0 0 22px}
.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--wabg);margin-bottom:16px;font-size:14px}
.banner svg{color:var(--wa)}
.banner .btn{margin-left:auto}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;border:1.5px dashed var(--line);border-radius:16px;padding:44px 20px;background:var(--side);cursor:pointer;transition:border-color .15s,background .15s}
.drop:hover,.drop.over{border-color:var(--fg);background:var(--sub)}
.drop .ic{width:48px;height:48px;border-radius:12px;background:var(--bg);border:1px solid var(--line);display:grid;place-items:center;margin-bottom:6px}
.drop .ic svg{width:22px;height:22px}
.drop b{font-size:16px;font-weight:600}
.drop .hint{color:var(--mut);font-size:14px}
.drop .btn{margin-top:10px}
.drop.compact{flex-direction:row;padding:14px 18px;gap:12px;text-align:left;justify-content:flex-start}
.drop.compact .ic{margin:0;width:40px;height:40px}
.drop.compact .btn{margin:0 0 0 auto}
.drop.compact .big{display:none}
.drop:not(.compact) .small{display:none}
.picked{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:12px;margin-top:16px}
.ph{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.ph img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;cursor:zoom-in}
.ph .fn{font-size:11.5px;color:var(--mut);padding:5px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid var(--line2)}
.ph button{position:absolute;top:6px;right:6px;width:24px;height:24px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;display:grid;place-items:center}
.ph button svg{width:13px;height:13px;stroke-width:2.6}
.go-bar{display:flex;align-items:center;gap:10px;justify-content:flex-end;margin-top:18px;flex-wrap:wrap}
.go-bar .info{margin-right:auto;color:var(--mut);font-size:14px}

/* risultati */
.res-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:28px 0 18px}
.res-head .page-h{margin:0}
.res-head .page-s{margin:2px 0 0}
.res-head .acts{margin-left:auto;display:flex;gap:8px}
.prog{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
.prog-t{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:500}
.prog-t span:last-child{margin-left:auto;color:var(--mut);font-weight:400}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--fg);animation:spin .8s linear infinite;flex:none;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.bar{height:4px;background:var(--line2);border-radius:4px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--fg);border-radius:4px;transition:width .4s cubic-bezier(.16,1,.3,1)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.flt{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:500;color:var(--mut)}
.flt:hover:not(:disabled){background:var(--hover);color:var(--fg)}
.flt.on{background:var(--pri);border-color:var(--pri);color:var(--pri-fg)}
.flt.on:hover{background:var(--pri-h);color:var(--pri-fg)}
.flt b{font-weight:600}
.flt:disabled{opacity:.4}

.pm{border:1px solid var(--line);border-radius:14px;background:var(--card);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden}
.pm-head{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px;text-align:left}
.pm-head:hover{background:color-mix(in srgb,var(--hover) 55%,transparent)}
.pm-head img{width:40px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);flex:none}
.pm-id{flex:1;min-width:0}
.pm-n{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-m{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pm-x{text-align:right;font-size:12.5px;color:var(--mut);line-height:1.3;min-width:96px}
.pm-x b{display:block;font-size:15px;color:var(--fg)}
.badge{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none}
.badge svg{width:14px;height:14px;stroke-width:2.4}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.wa{background:var(--wabg);color:var(--wa)}.badge.ko{background:var(--kobg);color:var(--ko)}.badge.wait{background:var(--sub);color:var(--mut)}
.chev{color:var(--faint);transition:transform .2s}
.pm.open .chev{transform:rotate(180deg)}
.pm-body{display:none;border-top:1px solid var(--line2);padding:16px}
.pm.open .pm-body{display:block}
.pm.pending .pm-head{cursor:default}
.pm.pending .pm-head:hover{background:none}

.issues{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.issue{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;font-size:14px}
.issue svg{width:17px;height:17px}
.issue>span{flex:1;min-width:0}
.issue.wa{background:var(--wabg)}.issue.wa svg{color:var(--wa)}
.issue.ko{background:var(--kobg)}.issue.ko svg{color:var(--ko)}
.issue .btn{margin-left:auto;background:var(--card);border:1px solid var(--line);height:30px;font-size:13px;padding:0 12px}
.issue .btn:hover{background:var(--hover)}
.okline{display:flex;align-items:center;gap:8px;color:var(--ok);font-size:14px;font-weight:500;margin-bottom:14px}
.okline svg{width:17px;height:17px}

.fields{display:flex;gap:10px 28px;flex-wrap:wrap;margin-bottom:14px}
.fields label{display:flex;flex-direction:column;gap:3px;color:var(--faint);font-size:12px;font-weight:500}
.fields input,.ptab input{border:1px solid var(--line);border-radius:8px;padding:5px 9px;background:var(--bg);width:128px;color:var(--fg);font-size:14px}
.fields input:hover,.ptab input:hover{border-color:var(--faint)}
.fields input:focus,.ptab input:focus{border-color:var(--fg)}
.fields .val{color:var(--fg);font-size:14px;padding:6px 0}
.fields .lnk{color:var(--fg);font-size:14px;padding:6px 0;text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line)}
.fields .lnk:hover{text-decoration-color:var(--fg)}

.ptab{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}
.ptab col.c2{width:160px}.ptab col.c3{width:150px}.ptab col.c4{width:44px}
.ptab th{text-align:left;font-size:12px;font-weight:600;color:var(--faint);padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
.ptab td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line2);vertical-align:middle}
.ptab tr:last-child td{border-bottom:0}
.ptab .nm{font-weight:600}
.ptab .nm.none{color:var(--faint);font-weight:500}
.ptab .rl{font-size:12.5px;color:var(--mut)}
.ptab input.wa{border-color:var(--wa);background:var(--wabg)}
.ptab input.ko{border-color:var(--ko);background:var(--kobg)}
.yrs{display:inline-block;font-weight:600;font-size:13px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.yrs.ok{background:var(--okbg);color:var(--ok)}.yrs.lo{background:var(--sub);color:var(--mut)}
.since{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.del{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--faint)}
.del:hover{background:var(--hover);color:var(--ko)}
.del svg{width:16px;height:16px}
.addp{margin-top:6px}
.more{margin-top:12px;border-top:1px solid var(--line2);padding-top:4px}
.more summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 0;font-size:13.5px;font-weight:500;color:var(--mut)}
.more summary::-webkit-details-marker{display:none}
.more summary:hover{color:var(--fg)}
.more summary svg{width:15px;height:15px;transition:transform .15s}
.more details[open] summary svg{transform:rotate(90deg)}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px 20px;margin:0 0 12px;padding:12px 14px;background:var(--side);border-radius:10px}
.kv dt{font-size:12px;color:var(--faint)}
.kv dd{margin:0;font-size:14px;word-break:break-word}
.kv .wide{grid-column:1/-1}
.hist-l{font-size:13px;color:var(--mut);columns:3;column-gap:24px;margin:0 0 12px;padding:12px 14px;background:var(--side);border-radius:10px}
.hist-l>div{break-inside:avoid;margin-bottom:10px}
.hist-l b{color:var(--fg);font-weight:600}
pre{white-space:pre-wrap;font:12px/1.55 "IBM Plex Mono",Consolas,monospace;color:var(--mut);background:var(--side);border-radius:10px;padding:12px 14px;max-height:240px;overflow:auto;margin:0 0 12px}
.empty-f{color:var(--mut);text-align:center;padding:28px 0;font-size:14px}

#zoom{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:30;cursor:zoom-out;padding:16px}
#zoom img{max-width:100%;max-height:100%;border-radius:8px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);background:var(--pri);color:var(--pri-fg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:40;pointer-events:none;max-width:90vw}
.toast.on{opacity:1;transform:translate(-50%,0)}
.scrim{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation-duration:2.4s}}

@media (max-width:820px){
  .side{position:fixed;inset:0 auto 0 0;z-index:25;transform:translateX(-100%)}

<script>
const $ = s => document.querySelector(s);
const ICON = {
  check:'<svg viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg>',
  alert:'<svg viewBox="0 0 24 24"><path d="M12 8v5M12 16.5h.01"/><circle cx="12" cy="12" r="9"/></svg>',
  xc:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  chevD:'<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
  chevR:'<svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>',
  img:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>',
  down:'<svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>',
  clock:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
};

/* ---------- stato ---------- */
let employees = new Map();   // matricola -> {nome, esperienza}
let permitRows = [];         // righe del Foglio1
let permitHeaders = [];
let images = [];             // foto scelte, non ancora analizzate
let results = [];            // permessi analizzati
let busy = false, pending = [], progress = {n:0, step:''};
let sessionId = null, filter = 'all';

/* ---------- utilità ---------- */
const norm = s => String(s ?? '').toUpperCase().replace(/[^A-Z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
const toDate = v => v instanceof Date ? v : (typeof v === 'number' ? new Date(Math.round((v-25569)*864e5)) : null);
const fmtD = d => d ? d.toLocaleDateString('it-IT') : '—';
const fmtV = v => v instanceof Date ? fmtD(v) : (typeof v === 'number' && !Number.isInteger(v) ? v.toFixed(2) : (v ?? ''));
const fmtDT = d => new Date(d).toLocaleString('it-IT',{dateStyle:'short',timeStyle:'short'});
const years = (from, to) => (from && to) ? (to - from) / (365 * 864e5) : null;
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const hamming = (a,b) => a.length!==b.length ? 99 : [...a].filter((c,i)=>c!==b[i]).length;
const plur = (n, s, p) => `${n} ${n===1?s:p}`;
let toastT;
const toast = m => { const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),3200); };

/* ---------- tema ---------- */
try { const th = localStorage.getItem('spaziConfinati.tema'); if (th) document.documentElement.dataset.theme = th; } catch(e){}
$('#themeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme;
  const dark = cur ? cur==='dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  document.documentElement.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('spaziConfinati.tema', dark ? 'light' : 'dark'); } catch(e){}
};

/* ---------- registro Excel ---------- */
function findHeaderRow(rows, word){
  for (let i=0;i<Math.min(rows.length,15);i++)
    if (rows[i].some(c => typeof c==='string' && c.toLowerCase().includes(word))) return i;
  return -1;
}
const DEFAULT_XLSX = 'LISTA SPAZI CONFINATI.xlsx';
const LS_KEY = 'spaziConfinati.excel';
const b64 = buf => { let s=''; const u=new Uint8Array(buf); for (let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode(...u.subarray(i,i+0x8000)); return btoa(s); };
const unb64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0)).buffer;
let excelBuf = null, excelName = '', excelMod = '', apiOk = false;

// L'Excel resta memorizzato: si carica una volta e si sostituisce con "Aggiorna".
// Al primo avvio (niente in memoria) prova a prenderlo dalla cartella dell'app.
async function initExcel(){
  // 1) il file nella cartella è la fonte principale: se c'è, si usa sempre quello
  if (await loadFromFolder()) return;
  // 2) altrimenti (app aperta senza server) la copia salvata nel browser
  try {
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || 'null');
    if (saved){ await loadExcel({name:saved.name, arrayBuffer:async()=>unb64(saved.data)}, false, saved.quando); return; }
  } catch(e){}
  $('#xName').textContent = 'Nessun registro';
  $('#xMeta').textContent = 'Premi "Aggiorna" e scegli il file Excel';
  render();
}
async function loadFromFolder(){
  try {
    const res = await fetch(encodeURI(DEFAULT_XLSX), {cache:'no-store'});
    if (!res.ok) return false;
    const mod = res.headers.get('Last-Modified') || '';
    await loadExcel({name:DEFAULT_XLSX, arrayBuffer:()=>res.arrayBuffer()}, true, mod ? new Date(mod).getTime() : undefined);
    excelMod = mod;
    return true;
  } catch(e){ return false; }
}
// quando torni sull'app (per esempio dopo aver salvato in Excel) ricontrolla il file nella cartella
let checking = false;
async function checkFolder(){
  if (checking || busy || !excelMod) return;
  checking = true;
  try {
    const res = await fetch(encodeURI(DEFAULT_XLSX), {method:'HEAD', cache:'no-store'});
    const mod = res.ok ? res.headers.get('Last-Modified') : '';
    if (mod && mod !== excelMod && await loadFromFolder()) toast('Registro ricaricato: il file nella cartella è stato modificato.');
  } catch(e){}
  checking = false;
}
addEventListener('focus', checkFolder);
document.addEventListener('visibilitychange', () => { if (!document.hidden) checkFolder(); });
fetch('api/stato', {cache:'no-store'}).then(r => r.ok && r.json()).then(j => { apiOk = !!(j && j.ok); render(); }).catch(()=>{});

async function loadExcel(file, remember, quando){
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {cellDates:true});   // si ferma qui se il file non è un Excel valido
  if (remember){
    quando = quando || Date.now();
    try { localStorage.setItem(LS_KEY, JSON.stringify({name:file.name, data:b64(buf), quando})); }
    catch(e){ toast('Il file è troppo grande per essere memorizzato: andrà ricaricato al prossimo avvio.'); }
  }
  excelBuf = buf; excelName = file.name; $('#xDown').disabled = false;
  employees.clear(); permitRows = []; permitHeaders = [];
  for (const name of wb.SheetNames){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, raw:true, defval:null});
    const hm = findHeaderRow(rows,'matricola'), hp = findHeaderRow(rows,'permesso');
    if (hm >= 0){
      const h = rows[hm].map(c => String(c??'').toLowerCase());
      const cM = h.findIndex(c=>c.includes('matricola')), cN = h.findIndex(c=>c.includes('dipendente')||c.includes('nom'));
      const cE = h.findIndex(c=>c.includes('esperienza'));
      for (const r of rows.slice(hm+1)){
        const m = String(r[cM]??'').replace(/\D/g,'');
        if (m.length>=6) employees.set(m, {nome: String(r[cN]??'').trim(), esperienza: toDate(r[cE])});
      }
    } else if (hp >= 0){
      const h = rows[hp];
      const cols = h.map((c,i)=>c!=null?i:-1).filter(i=>i>=0);
      permitHeaders = cols.map(i => String(h[i]).replace(/�/g,'°'));
      const cP = cols.find(i => String(h[i]).toLowerCase().includes('permesso'));
      const cG = cols.find(i => String(h[i]).toLowerCase().includes('giorno'));
      const cNm = cols.find(i => String(h[i]).toLowerCase().includes('nominativ'));
      for (const r of rows.slice(hp+1)){
        if (!r[cNm] && !r[cP]) continue;
        permitRows.push({_permesso: r[cP]!=null ? String(r[cP]).replace(/\D/g,'') : '', _giorno: toDate(r[cG]), _nomi: String(r[cNm]??''), _cells: cols.map(i=>r[i])});
      }
    }
  }
  $('#xName').textContent = file.name;
  $('#xMeta').innerHTML = `<span class="num">${employees.size}</span> matricole · <span class="num">${permitRows.length}</span> permessi${quando?`<br>Modificato il <span class="num">${fmtDT(quando)}</span>`:''}`;
  render();
}
async function onExcelPicked(e){
  const f = e.target.files[0]; e.target.value=''; if (!f) return;
  if (apiOk){
    try {
      XLSX.read(await f.arrayBuffer(), {sheetRows:2});   // controlla che sia un Excel
      const res = await fetch('api/registro', {method:'POST', body:f});
      const j = await res.json();
      if (!res.ok) return toast(j.errore || 'Salvataggio non riuscito.');
      await loadFromFolder();
      return toast(`Registro sostituito nella cartella con ${f.name}. La versione precedente è in backup_registro.`);
    } catch(err){ return toast('Il file non è un Excel leggibile: ' + (err.message||err)); }
  }
  loadExcel(f, true).then(()=>toast(`Registro aggiornato: ${f.name}`)).catch(err=>toast('Il file non è un Excel leggibile: '+err.message));
}
$('#fx').onchange = onExcelPicked;
$('#xDown').onclick = () => {
  if (!excelBuf) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([excelBuf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  a.download = excelName || DEFAULT_XLSX; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
};

/* ---------- lettura foto (OCR) ---------- */
async function preprocess(file){
  const img = await createImageBitmap(file);
  const scale = 3000 / Math.max(img.width, img.height);   // ingrandisce le foto piccole (WhatsApp)
  const c = document.createElement('canvas');
  c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
  const g = c.getContext('2d'); g.filter = 'grayscale(1)'; g.drawImage(img,0,0,c.width,c.height);
  return c;
}
function cropCanvas(src, y0, y1, wFrac){
  const c = document.createElement('canvas');
  c.width = Math.round(src.width*wFrac); c.height = Math.max(10, Math.round(y1-y0));
  c.getContext('2d').drawImage(src, 0, y0, c.width, c.height, 0, 0, c.width, c.height);
  return c;
}
// matricole in un testo, con ruolo (prima/dopo "ASSISTENTE ESTERNO")
function codesIn(text){
  const T = text.replace(/[Oo](?=\d)|(?<=\d)[Oo]/g,'0').toUpperCase();
  const idxA = T.search(/ASSISTENTE\s+ESTERN/), idxEnd = T.search(/AREA\s+DI\s+LAVORO/);
  const out = []; const re = /(?<!\d)(60\d{6})(?!\d)/g; let m;
  while ((m = re.exec(T))){
    if (idxEnd>0 && m.index > idxEnd) continue;
    out.push({code:m[1], ruolo: (idxA>=0 && m.index>idxA) ? 'Assistente esterno' : 'Addetto'});
  }
  return out;
}
// unisce le due letture scartando i quasi-doppioni (1 cifra diversa)
function mergeCodes(lists){
  const res = [];
  for (const c of lists.flat()){
    const dup = res.find(r => hamming(r.code, c.code) <= 1);
    if (!dup) res.push({...c});
    else if (!employees.has(dup.code) && employees.has(c.code)) dup.code = c.code;
  }
  return res;
}
function parseText(text){
  const up = text.replace(/[Oo](?=\d)|(?<=\d)[Oo]/g,'0').replace(/(?<=\d)[lI|](?=\d)/g,'1').toUpperCase();
  const permesso = (up.match(/PERMESS[O0]\s*[:.]?\s*(\d{4,6})/) || up.match(/PERMESSO_?\s*(\d{4,6})/) || [])[1] || '';
  const dm = up.match(/DATA\s*(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  let data = null;
  if (dm){ let y=+dm[3]; if (y<100) y+=2000; data = new Date(y, dm[2]-1, +dm[1]); }
  const cn = (up.match(/COSTRUZIONE NAVALE\s*(\d{4})/) || [])[1] || '';
  const imp = (up.match(/IMPRESA APPALTATRICE\s+([A-Z0-9 .]+?(?:SRL|SPA|SNC|SAS)?)\s*$/m) || [])[1] || '';
  return {permesso, data, cn, codes: codesIn(text), impresa: imp.trim(), testo: text};
}

/* ---------- confronto con il registro ---------- */
function lookup(code){
  if (employees.has(code)) return {code, match:'esatto', ...employees.get(code)};
  const near = [...employees.keys()].filter(k => hamming(k,code)===1);   // tolleranza 1 cifra
  if (near.length===1) return {code: near[0], match:'simile', ...employees.get(near[0])};
  return {code, match:'nessuno', nome:'', esperienza:null};
}
function enrich(r){
  r.people = r.codes.map(c => {
    const e = lookup(c.code);
    return {...c, ...e, letto:c.code, anni: years(e.esperienza, r.data || new Date())};
  });
  const known = r.people.filter(p=>p.match!=='nessuno');
  r.trovati = known.length;
  r.esperti = known.filter(p=>p.anni>=3).length;
  r.perc = known.length ? r.esperti/known.length : null;
  r.excelRow = permitRows.find(p => p._permesso && p._permesso === r.permesso) || null;
  r.storico = {};
  for (const p of r.people) if (p.nome){
    const n = norm(p.nome);
    r.storico[p.code] = permitRows.filter(x => norm(x._nomi).includes(n));
  }
  // problemi da risolvere, in ordine di gravità
  const iss = [];
  if (r.perc!=null && r.perc<0.3) iss.push({t:'ko', m:`Solo ${r.esperti} su ${r.trovati} con almeno 3 anni di esperienza (${Math.round(r.perc*100)}%). Serve almeno il 30%.`});
  if (!r.people.length) iss.push({t:'ko', m:'Nessuna matricola letta dalla foto. Aggiungile a mano.'});
  r.people.forEach((p,j) => {
    if (p.match==='simile') iss.push({t:'wa', m:`La matricola ${p.letto} non è nel registro. La più vicina è ${p.code} (${p.nome}).`, fix:{j, code:p.code}});
    if (p.match==='nessuno') iss.push({t:'ko', m: p.letto ? `La matricola ${p.letto} non è nel registro. Controlla la foto e correggila.` : 'Matricola vuota: inseriscila o elimina la riga.'});
  });
  if (!r.permesso) iss.push({t:'wa', m:'Numero di permesso non letto. Inseriscilo qui sotto.'});
  else if (!r.excelRow) iss.push({t:'wa', m:`Il permesso ${r.permesso} non è nel Foglio1 del registro.`});
  else {
    const manc = r.people.filter(p=>p.nome && !norm(r.excelRow._nomi).includes(norm(p.nome))).map(p=>p.nome);
    if (manc.length) iss.push({t:'wa', m:`Nel Foglio1 il permesso ${r.permesso} non riporta: ${manc.join(', ')}.`});
  }
  r.issues = iss;
  r.stato = (r.perc!=null && r.perc<0.3) ? 'ko' : iss.length ? 'wa' : 'ok';
  if (r._open === undefined) r._open = r.stato !== 'ok';
  return r;
}
const STATO = {ok:['Conforme',ICON.check], wa:['Da verificare',ICON.alert], ko:['Non conforme',ICON.xc]};

/* ---------- cronologia (salvata nel browser) ---------- */
const MAX_HIST = 100;
const dbP = new Promise((ok, ko) => {
  const rq = indexedDB.open('spaziConfinati', 1);
  rq.onupgradeneeded = () => rq.result.createObjectStore('sessioni', {keyPath:'id'});
  rq.onsuccess = () => ok(rq.result); rq.onerror = () => ko(rq.error);
});
async function store(mode, fn){
  const db = await dbP;
  return new Promise((ok, ko) => {
    const tx = db.transaction('sessioni', mode); const rq = fn(tx.objectStore('sessioni'));
    tx.oncomplete = () => ok(rq && rq.result); tx.onerror = () => ko(tx.error);
  });
}
async function thumb(file){
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1400 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = img.width*s; c.height = img.height*s;
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL('image/jpeg', 0.75);
}
const strip = r => ({file:r.file, url:r.url, permesso:r.permesso, data:r.data, cn:r.cn, impresa:r.impresa, testo:r.testo, stato:r.stato,
                     codes:r.codes.map(c=>({code:c.code, ruolo:c.ruolo}))});
async function saveSession(){
  if (!sessionId || !results.length) return;
  try {
    await store('readwrite', s => s.put({id:sessionId, quando:new Date(sessionId), risultati:results.map(strip)}));
    const all = await store('readonly', s => s.getAllKeys());
    for (const k of all.sort((a,b)=>b-a).slice(MAX_HIST)) await store('readwrite', s => s.delete(k));
  } catch(e){ console.warn('cronologia non salvata', e); }
  renderHistory();
}
const histTitle = h => { const p = h.risultati.map(r=>r.permesso||'?'); return p.slice(0,3).join(', ') + (p.length>3?` +${p.length-3}`:''); };
async function renderHistory(){
  let list = [];
  try { list = await store('readonly', s => s.getAll()); } catch(e){}
  list.sort((a,b)=>b.id-a.id);
  $('#histClear').style.visibility = list.length ? 'visible' : 'hidden';
  if (!list.length){ $('#hist').innerHTML = '<div class="h-empty">Nessuna analisi salvata.</div>'; return; }
  const today = new Date(); today.setHours(0,0,0,0);
  const group = id => { const d=(today - new Date(id).setHours(0,0,0,0))/864e5;
    return d<=0?'Oggi':d<=1?'Ieri':d<7?'Ultimi 7 giorni':d<30?'Ultimi 30 giorni':'Meno recenti'; };
  let html='', last='';
  for (const h of list){
    const g = group(h.id);
    if (g!==last){ html += `<div class="side-label" style="padding-top:${last?14:2}px">${g}</div>`; last=g; }
    const st = h.risultati.some(r=>r.stato==='ko') ? 'ko' : h.risultati.some(r=>r.stato==='wa') ? 'wa' : 'ok';
    html += `<button class="h-item${h.id===sessionId?' on':''}" data-id="${h.id}">
      <div class="h-t">Permess${h.risultati.length>1?'i':'o'} ${esc(histTitle(h))}</div>
      <div class="h-s"><span class="dot ${st}"></span><span class="num">${new Date(h.id).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})}</span> · ${h.risultati.length} foto</div>

/* Senza server (app online): il file .xlsx viene modificato direttamente nel browser.
   Si toccano solo le righe nuove del Foglio1, la tabella e il ricalcolo: stili, formule e il resto restano come sono. */
const colN = l => [...l].reduce((n,c)=>n*26 + c.charCodeAt(0)-64, 0);
const colL = n => { let s=''; while (n){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=(n-m-1)/26; } return s; };
const xmlEsc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const serial = iso => { const [y,m,d] = iso.split('-').map(Number); return Math.round((Date.UTC(y,m-1,d) - Date.UTC(1899,11,30)) / 864e5); };
const shiftRows = (f, delta) => f.replace(/(?<![A-Za-z_\d.\[])(\$?)([A-Z]{1,3})(\$?)(\d+)(?![\d(])/g, (all, d1, c, d2, r) => d2 ? all : d1 + c + (+r + delta));
async function regInBrowser(righe, b){
  try {
    const zip = await JSZip.loadAsync(excelBuf);
    // trova il foglio con l'intestazione "permesso"
    const wbX = await zip.file('xl/workbook.xml').async('string');
    const rels = await zip.file('xl/_rels/workbook.xml.rels').async('string');
    const wbS = XLSX.read(excelBuf, {sheetRows:30});
    let sh = null, hdr = 0, col = {};
    for (const name of wbS.SheetNames){
      const ws = wbS.Sheets[name];
      for (const a of Object.keys(ws)){ if (a[0]==='!') continue;
        if (/permesso/i.test(String(ws[a].v))){ sh = name; hdr = XLSX.utils.decode_cell(a).r + 1; break; } }
      if (sh){
        for (const a of Object.keys(ws)){ if (a[0]==='!') continue; const c = XLSX.utils.decode_cell(a); if (c.r+1 !== hdr) continue;
          const v = String(ws[a].v).toLowerCase(), L = colL(c.c+1);
          if (v.includes('permesso')) col.p = L; else if (v.includes('giorno')) col.g = L; else if (v.includes('nominativ')) col.n = L;
          else if (v.includes('costruz')) col.c = L; else if (v.trim()==='capo') col.capo = L; else if (v.includes('corso')) (col.corsi ||= []).push(L); }
        col.corsi = (col.corsi||[]).sort((x,y)=>colN(x)-colN(y));
        break;
      }
    }
    if (!sh || !col.p || !col.n) throw new Error('Nel registro non trovo il foglio con le colonne "n° permesso" e "nominativi".');
    const rid = new DOMParser().parseFromString(wbX,'application/xml').querySelector(`sheet[name="${CSS.escape(sh)}"]`)?.getAttribute('r:id');
    const target = (rels.match(new RegExp(`<Relationship[^>]*Id="${rid}"[^>]*>`)) || [''])[0].match(/Target="([^"]+)"/)[1];
    const path = 'xl/' + target.replace(/^\/?xl\//,'');
    let x = await zip.file(path).async('string');
    // righe esistenti
    const rows = new Map();
    for (const m of x.matchAll(/<row [^>]*?r="(\d+)"[^>]*?(?:\/>|>[\s\S]*?<\/row>)/g)) rows.set(+m[1], m[0]);
    const cellOf = (rowXml, L, r) => (rowXml || '').match(new RegExp(`<c r="${L}${r}"[^>]*?(?:/>|>[\\s\\S]*?</c>)`))?.[0] || '';
    const hasVal = c => /<v>|<is>/.test(c);
    let last = hdr;
    for (const [r, rx] of rows) if (r > hdr && (hasVal(cellOf(rx, col.p, r)) || hasVal(cellOf(rx, col.n, r)))) last = Math.max(last, r);
    if (last === hdr) throw new Error('Il Foglio1 non ha ancora righe da usare come modello.');
    const tpl = rows.get(last), tplCells = [...tpl.matchAll(/<c r="([A-Z]+)\d+"[^>]*?(?:\/>|>[\s\S]*?<\/c>)/g)].map(m => ({L:m[1], xml:m[0]}));
    // formule condivise: testo della cella "madre" per si
    const master = {};
    for (const m of x.matchAll(/<c r="[A-Z]+(\d+)"[^>]*>\s*<f ([^>]*)>([^<]+)<\/f>/g)){
      const si = (m[2].match(/si="(\d+)"/)||[])[1];
      if (si && /t="shared"/.test(m[2]) && /ref="/.test(m[2])) master[si] ??= {row:+m[1], f:m[3]};
    }
    const gia = new Set(permitRows.map(p=>p._permesso).filter(Boolean));
    const aggiunti = [], saltati = [];
    let r = last;
    for (const it of righe){
      const num = String(it.permesso||'').replace(/\D/g,'');
      if (!num){ saltati.push({permesso:'', motivo:'manca il numero'}); continue; }
      if (gia.has(num)){ saltati.push({permesso:num, motivo:'già presente'}); continue; }
      r++;
      const vals = {};
      vals[col.p] = {n:+num};
      if (col.g && it.giorno) vals[col.g] = {n:serial(it.giorno)};
      vals[col.n] = {s:(it.nominativi||[]).join(' - ')};
      const cn = String(it.costruzione||'').replace(/\D/g,''); if (col.c && cn) vals[col.c] = {n:+cn};
      if (col.capo && it.capo?.trim()) vals[col.capo] = {s:it.capo.trim().toUpperCase()};
      col.corsi.forEach((L,k) => { const d = (it.esperienze||[])[k]; vals[L] = d ? {n:serial(d)} : {s:'-'}; });
      const cells = tplCells.map(({L, xml}) => {
        const st = (xml.match(/ s="(\d+)"/) || [])[0] || '';
        const v = vals[L];
        if (v) return v.n != null ? `<c r="${L}${r}"${st}><v>${v.n}</v></c>` : `<c r="${L}${r}"${st} t="inlineStr"><is><t>${xmlEsc(v.s)}</t></is></c>`;
        let f = null;
        const fm = xml.match(/<f([^>]*)>([^<]*)<\/f>|<f([^>]*)\/>/);
        if (fm){
          const attrs = fm[1] ?? fm[3], si = (attrs.match(/si="(\d+)"/)||[])[1];
          if (fm[2] && !/t="shared"/.test(attrs)) f = shiftRows(fm[2], r - last);
          else if (si && master[si]) f = shiftRows(master[si].f, r - master[si].row);
          else if (fm[2]) f = shiftRows(fm[2], r - last);
        }
        const ca = fm && /ca="1"/.test(fm[1] ?? fm[3]) ? ' ca="1"' : '';
        return f != null ? `<c r="${L}${r}"${st}><f${ca}>${f}</f></c>` : `<c r="${L}${r}"${st}/>`;
      }).join('');
      const rowAttrs = (tpl.match(/<row ([^>]*?)\/?>/)[1]).replace(/\br="\d+"/, `r="${r}"`).replace(/\s*thickBot="1"/,'').replace(/\/$/,'');
      const newRow = `<row ${rowAttrs}>${cells}</row>`;
      if (rows.has(r)) x = x.replace(rows.get(r), newRow);
      else {
        const after = [...rows.keys()].filter(k => k > r).sort((a,b)=>a-b)[0];
        x = after ? x.replace(rows.get(after), newRow + rows.get(after)) : x.replace('</sheetData>', newRow + '</sheetData>');
      }
      rows.set(r, newRow);
      gia.add(num); aggiunti.push({permesso:num, riga:r});
    }
    if (!aggiunti.length) throw new Error('Nessun permesso aggiunto: ' + saltati.map(s=>`${s.permesso||'?'} (${s.motivo})`).join(', '));
    // dimensione del foglio e tabella
    x = x.replace(/<dimension ref="([A-Z]+\d+):([A-Z]+)(\d+)"\/>/, (all,a,c,n) => `<dimension ref="${a}:${c}${Math.max(+n, r)}"/>`);
    zip.file(path, x);
    const relPath = path.replace(/worksheets\/([^/]+)$/, 'worksheets/_rels/$1.rels');
    const sRels = zip.file(relPath) ? await zip.file(relPath).async('string') : '';
    for (const m of sRels.matchAll(/Target="([^"]*tables\/[^"]+)"/g)){
      const tp = 'xl/tables/' + m[1].split('/').pop(); let t = await zip.file(tp)?.async('string'); if (!t) continue;
      const ref = t.match(/<table [^>]*\bref="([A-Z]+)(\d+):([A-Z]+)(\d+)"/);
      if (ref && +ref[2] === hdr && +ref[4] < r){
        const nr = `${ref[1]}${ref[2]}:${ref[3]}${r}`;
        t = t.replace(/(<table [^>]*\bref=")[^"]+"/, `$1${nr}"`).replace(/(<autoFilter [^>]*\bref=")[^"]+"/, `$1${nr}"`);
        zip.file(tp, t);
      }
    }
    // Excel ricalcola tutte le formule all'apertura
    let wbx = wbX.includes('<calcPr') ? wbX.replace(/<calcPr([^>]*?)\/>/, (a, at) => `<calcPr${at.replace(/\s*fullCalcOnLoad="[^"]*"/,'')} fullCalcOnLoad="1"/>`) : wbX.replace('</workbook>', '<calcPr fullCalcOnLoad="1"/></workbook>');
    zip.file('xl/workbook.xml', wbx);
    const out = await zip.generateAsync({type:'arraybuffer', compression:'DEFLATE'});
    const name = excelName || DEFAULT_XLSX;
    await loadExcel({name, arrayBuffer:async()=>out}, true);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
    a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
    closePay(); saveSession();
    const sk = saltati.length ? ` Saltati: ${saltati.map(s=>`${s.permesso||'?'} (${s.motivo})`).join(', ')}.` : '';
    toast(`${plur(aggiunti.length,'permesso aggiunto','permessi aggiunti')} al Foglio1. Registro aggiornato scaricato.${sk}`);
    return {aggiunti, saltati};
  } catch(err){
    console.error(err);
    const e = $('#regErr'); if (e){ e.textContent = err.message; e.style.display = 'block'; }
    delete b.dataset.busy; updRegBtn();
  }
}

/* ---------- analisi ---------- */
async function analyze(){
  if (busy || !images.length || !employees.size) return;
  if (images.length > rimasti()) return openPay(images.length);
  const files = images; images = [];
  busy = true; results = []; filter = 'all'; sessionId = Date.now();
  pending = files.map(f=>({url:f._url, name:f.name}));
  progress = {n:files.length, step:'Avvio lettura…'};
  render();
  try {
    let i = 0, step = '';
    const worker = await Tesseract.createWorker('ita', 1, {
      logger: m => { if (m.status==='recognizing text') setProg(i, files.length, step, m.progress); }
    });
    for (i=0;i<files.length;i++){
      const canvas = await preprocess(files[i]);
      // 1ª lettura: pagina intera (n° permesso, data…) e posizione delle righe
      step = `Foto ${i+1} di ${files.length}: lettura del modulo`;
      await worker.setParameters({tessedit_pageseg_mode:'3', tessedit_char_whitelist:''});
      const {data} = await worker.recognize(canvas, {}, {text:true, blocks:true});
      const r = parseText(data.text);
      // 2ª lettura: solo la tabella dei nominativi (le linee della tabella disturbano la prima)
      const lines = (data.blocks||[]).flatMap(b=>b.paragraphs.flatMap(p=>p.lines));
      const lA = lines.find(l=>/ADDETTO|NOMINATIVO PERSONALE/i.test(l.text));
      const y0 = lA ? lA.bbox.y1 : canvas.height*0.25;
      const lB = lines.find(l=>/AREA DI LAVORO|COSTRUZIONE NAVALE/i.test(l.text) && l.bbox.y0>y0);
      const y1 = lB ? lB.bbox.y0 : Math.min(canvas.height, y0 + canvas.height*0.35);
      step = `Foto ${i+1} di ${files.length}: lettura delle matricole`;
      await worker.setParameters({tessedit_pageseg_mode:'6', tessedit_char_whitelist:'0123456789ABCDEFGHIJKLMNOPQRSTUVZ '});
      const crop = await worker.recognize(cropCanvas(canvas, y0, y1, 0.6));
      r.codes = mergeCodes([codesIn(crop.data.text), r.codes]);
      r.testo += '\n----- tabella nominativi -----\n' + crop.data.text;
      r.file = files[i].name; r.url = await thumb(files[i]);
      results.push(r); if (!piano){ usati++; lsSet('spaziConfinati.prova', usati); renderPlan(); }
      progress.step = step; render(); saveSession();
    }
    await worker.terminate();
  } catch(err){
    console.error(err); toast('Errore durante la lettura: ' + (err.message || err));
  } finally {
    busy = false; pending = []; render(); renderHistory();
  }
}
function setProg(i, n, step, p){
  const half = step.includes('matricole') ? .5 : 0;
  const pct = Math.round(((i + half + (p||0)/2) / n) * 100);
  const t = $('#progStep'), b = $('#progBar');
  if (t) t.textContent = step;
  if (b) b.style.width = pct + '%';
}

/* ---------- viste ---------- */
function render(){
  results.forEach(enrich);
  const inRes = results.length || busy;
  $('#view').innerHTML = inRes ? viewResults() : viewUpload();
  $('#topName').textContent = inRes && sessionId ? `Analisi del ${fmtDT(sessionId)}` : 'Controllo permessi spazi confinati';
}

function viewUpload(){
  const noXl = !employees.size, n = images.length;
  return `
    <h1 class="page-h">Carica le foto dei permessi</h1>
    <p class="page-s">Da ogni foto vengono letti il numero di permesso e le matricole, poi confrontati con il registro Excel.</p>
    ${noXl ? `<div class="banner">${ICON.alert}<span>Manca il registro Excel: caricalo per controllare le matricole.</span><label class="btn sec sm" style="cursor:pointer">Carica Excel<input type="file" accept=".xlsx,.xls" hidden data-act="xl"></label></div>` : ''}
    <div class="drop${n?' compact':''}" data-act="pick" role="button" tabindex="0" aria-label="Scegli le foto">
      <div class="ic">${ICON.img}</div>
      <div class="big"><b>Trascina qui le foto</b><br><span class="hint">oppure</span></div>
      <div class="small"><b>Aggiungi altre foto</b><br><span class="hint">Trascinale qui o usa il pulsante</span></div>
      <span class="btn ${n?'sec sm':'pri'}">${ICON.plus}<span>Scegli foto</span></span>
    </div>
    ${n ? `
      <div class="picked">${images.map((f,i)=>`<div class="ph"><img src="${f._url}" alt="" data-act="zoom"><div class="fn">${esc(f.name)}</div><button data-act="rm" data-i="${i}" aria-label="Togli foto">${ICON.x}</button></div>`).join('')}</div>
      <div class="go-bar">
        <span class="info">${plur(n,'foto selezionata','foto selezionate')}${piano ? '' : ` · ${rimasti()} gratuite rimaste`}</span>
        <button class="btn txt" data-act="clear">Togli tutte</button>
        <button class="btn pri" data-act="go" ${noXl?'disabled':''}>Analizza ${n} foto</button>
      </div>` : ''}`;
}

function viewResults(){
  const n = busy ? progress.n : results.length;
  const cnt = {ok:0, wa:0, ko:0};
  results.forEach(r => cnt[r.stato]++);
  const flt = (k, label) => {
    const c = k==='all' ? results.length : cnt[k];
    return `<button class="flt${filter===k?' on':''}" data-act="filter" data-k="${k}" ${k!=='all'&&!c?'disabled':''}>${k!=='all'?`<span class="dot ${k}"></span>`:''}${label} <b class="num">${c}</b></button>`;
  };
  const list = results.map((r,i)=>[r,i]).filter(([r])=>filter==='all'||r.stato===filter);
  const pend = busy ? pending.slice(results.length).map((p,k)=>`
    <article class="pm pending"><div class="pm-head"><img src="${p.url}" alt="">
      <div class="pm-id"><div class="pm-n">${esc(p.name)}</div><div class="pm-m">${k===0?'Lettura in corso':'In attesa'}</div></div>
      <span class="badge wait">${k===0?'<span class="spin"></span>In lettura':ICON.clock+'In coda'}</span></div></article>`).join('') : '';
  return `
    <div class="res-head">
      <div><h1 class="page-h">${busy ? 'Lettura in corso' : 'Risultati'}</h1>
        <p class="page-s">${plur(n,'permesso','permessi')}${busy?'':` · ${cnt.ok} conformi · ${cnt.wa} da verificare · ${cnt.ko} non conformi`}</p></div>
      ${busy ? '' : `<div class="acts">${employees.size ? `<button class="btn sec" data-act="reg">${ICON.plus}Aggiungi al registro</button>` : ''}<button class="btn sec" data-act="export">${ICON.down}Esporta Excel</button><button class="btn pri" data-act="new">${ICON.plus}Nuova analisi</button></div>`}
    </div>
    ${busy ? `<div class="prog"><div class="prog-t"><span class="spin"></span><span id="progStep">${esc(progress.step)}</span><span class="num">${results.length} di ${progress.n} fatte</span></div><div class="bar"><i id="progBar" style="width:${Math.round(results.length/progress.n*100)}%"></i></div></div>` : ''}
    ${results.length ? `<div class="filters">${flt('all','Tutti')}${flt('ok','Conformi')}${flt('wa','Da verificare')}${flt('ko','Non conformi')}</div>` : ''}
    ${list.map(([r,i])=>permitCard(r,i)).join('') || (results.length ? '<div class="empty-f">Nessun permesso in questa categoria.</div>' : '')}
    ${pend}`;
}

function permitCard(r, i){
  const [label, ico] = STATO[r.stato];
  const meta = [fmtD(r.data), r.cn && `Costr. navale ${r.cn}`, plur(r.people.length,'persona','persone')].filter(Boolean).join(' · ');
  const issues = r.issues.length
    ? `<div class="issues">${r.issues.map(x=>`<div class="issue ${x.t}">${x.t==='ko'?ICON.xc:ICON.alert}<span>${esc(x.m)}</span>${x.fix?`<button class="btn" data-act="fix" data-i="${i}" data-j="${x.fix.j}" data-code="${x.fix.code}">Usa ${x.fix.code}</button>`:''}</div>`).join('')}</div>`
    : `<div class="okline">${ICON.check}Tutte le matricole sono nel registro, almeno il 30% ha 3 anni di esperienza e i nominativi coincidono con il Foglio1.</div>`;
  const rows = r.people.map((p,j)=>`
    <tr>
      <td><div class="nm${p.nome?'':' none'}">${esc(p.nome) || 'Non trovato'}</div><div class="rl">${p.ruolo}</div></td>
      <td><input class="mono ${p.match==='simile'?'wa':p.match==='nessuno'?'ko':''}" value="${esc(p.letto)}" data-act="code" data-i="${i}" data-j="${j}" inputmode="numeric" aria-label="Matricola"></td>
      <td class="c-yrs">${p.anni!=null ? `<span class="yrs ${p.anni>=3?'ok':'lo'}">${p.anni.toFixed(1).replace('.',',')} anni</span><span class="since num">dal ${fmtD(p.esperienza)}</span>` : '<span class="since">—</span>'}</td>
      <td class="c-del"><button class="del" data-act="del" data-i="${i}" data-j="${j}" title="Elimina riga" aria-label="Elimina riga">${ICON.trash}</button></td>
    </tr>`).join('');
  const x = r.excelRow;
  const kv = x ? permitHeaders.map((h,k)=>{ const v=x._cells[k]; if (v==null||v==='') return '';
      return `<div class="${/nominativ/i.test(h)?'wide':''}"><dt>${esc(h)}</dt><dd>${esc(fmtV(v))}</dd></div>`; }).join('') : '';
  const hist = r.people.filter(p=>(r.storico[p.code]||[]).length).map(p =>
      `<div><b>${esc(p.nome)}</b><br>${r.storico[p.code].slice(-12).reverse().map(s=>`<span class="num">${s._permesso||'s.n.'} · ${fmtD(s._giorno)}</span>`).join('<br>')}</div>`).join('');
  return `<article class="pm${r._open?' open':''}">
    <button class="pm-head" data-act="toggle" data-i="${i}" aria-expanded="${r._open}">
      <img src="${r.url}" alt="">
      <div class="pm-id"><div class="pm-n">Permesso <span class="num">${esc(r.permesso)||'?'}</span></div><div class="pm-m">${esc(meta)}</div></div>
      <div class="pm-x">${r.perc!=null?`<b class="num">${Math.round(r.perc*100)}%</b>esperti (${r.esperti} su ${r.trovati})`:'—'}</div>
      <span class="badge ${r.stato}">${ico}${label}</span>
      ${ICON.chevD}
    </button>
    <div class="pm-body">
      ${issues}
      <div class="fields">
        <label>Numero permesso<input class="mono" value="${esc(r.permesso)}" data-act="perm" data-i="${i}" inputmode="numeric"></label>
        <label>Data<span class="val num">${fmtD(r.data)}</span></label>
        ${r.impresa?`<label>Impresa<span class="val">${esc(r.impresa)}</span></label>`:''}
        <label>Foto<button class="lnk" data-act="zoomr" data-i="${i}">${esc(r.file)}</button></label>
      </div>
      <table class="ptab"><colgroup><col><col class="c2"><col class="c3"><col class="c4"></colgroup>
        <thead><tr><th>Persona</th><th>Matricola</th><th>Esperienza</th><th></th></tr></thead>
        <tbody>${rows || '<tr><td colspan="4" class="rl">Nessuna persona.</td></tr>'}</tbody>
      </table>
      <button class="btn txt addp" data-act="add" data-i="${i}">${ICON.plus}Aggiungi matricola</button>
      <div class="more">
        ${x ? `<details><summary>${ICON.chevR}Riga del permesso nel Foglio1</summary><dl class="kv">${kv}</dl></details>` : ''}
        ${hist ? `<details><summary>${ICON.chevR}Altri permessi delle stesse persone</summary><div class="hist-l">${hist}</div></details>` : ''}
        <details><summary>${ICON.chevR}Testo letto dalla foto</summary><pre>${esc(r.testo)}</pre></details>
      </div>
    </div>
  </article>`;
}

/* ---------- azioni ---------- */
$('#view').addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, i = +t.dataset.i;
  if (a==='xl') return;
  if (a==='pick') return $('#fi').click();
  if (a==='zoom' || a==='zoomr'){ e.stopPropagation(); const z=new Image(); z.src = a==='zoom' ? t.src : results[i].url; z.alt='Foto del permesso'; $('#zoom').replaceChildren(z); $('#zoom').style.display='flex'; return; }
  if (a==='rm'){ images.splice(i,1); return render(); }
  if (a==='clear'){ images = []; return render(); }
  if (a==='go') return analyze();
  if (a==='new') return newAnalysis();
  if (a==='export') return exportXlsx();
  if (a==='reg') return openReg();
  if (a==='filter'){ filter = t.dataset.k; return render(); }
  if (a==='toggle'){ if (results[i]){ results[i]._open = !results[i]._open; render(); } return; }
  if (busy) return;
  if (a==='fix'){ results[i].codes[+t.dataset.j].code = t.dataset.code; render(); return saveSession(); }
  if (a==='del'){ results[i].codes.splice(+t.dataset.j,1); render(); return saveSession(); }
  if (a==='add'){ results[i].codes.push({code:'', ruolo:'Addetto'}); render(); saveSession();
    const ins = document.querySelectorAll(`[data-act="code"][data-i="${i}"]`); ins[ins.length-1]?.focus(); }
});
$('#view').addEventListener('keydown', e => {
  if (e.key==='Enter' && e.target.matches('input')) e.target.blur();
  if ((e.key==='Enter'||e.key===' ') && e.target.matches('.drop')){ e.preventDefault(); $('#fi').click(); }
});
$('#view').addEventListener('change', e => {
  const t = e.target, i = +t.dataset.i;
  if (t.dataset.act==='xl') return onExcelPicked(e);
  if (busy) return;
  if (t.dataset.act==='code') results[i].codes[+t.dataset.j].code = t.value.replace(/\D/g,'');
  else if (t.dataset.act==='perm') results[i].permesso = t.value.replace(/\D/g,'');
  else return;
  render(); saveSession();
});
$('#zoom').onclick = () => $('#zoom').style.display='none';
addEventListener('keydown', e => { if (e.key==='Escape'){ $('#zoom').style.display='none'; closePay(); } });

function exportXlsx(){
  const out = [];
  for (const r of results) for (const p of (r.people.length ? r.people : [{}])) out.push({
    'N° permesso': r.permesso, 'Data': r.data, 'Costr. navale': r.cn, 'Esito': STATO[r.stato][0],
    'Ruolo': p.ruolo||'', 'Matricola letta': p.letto||'', 'Matricola registro': p.match&&p.match!=='nessuno'?p.code:'',
    'Nominativo': p.nome||'', 'Esperienza dal': p.esperienza||'', 'Anni esperienza': p.anni!=null?+p.anni.toFixed(1):'',
    '≥3 anni': p.anni>=3?'SI':'NO', '% esperti': r.perc!=null?+(r.perc*100).toFixed(0):'',
    'Nel Foglio1': r.excelRow?'SI':'NO', 'Problemi': r.issues.map(x=>x.m).join(' | '), 'File': r.file
  });
  const ws = XLSX.utils.json_to_sheet(out, {cellDates:true});
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Risultati');
  XLSX.writeFile(wb, `controllo_permessi_${new Date().toISOString().slice(0,10)}.xlsx`);
}

renderHistory();
render();
initExcel();
</script>
</body>
